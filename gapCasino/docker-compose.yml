version: '3.8'

services:
  # User Service
  user-service:
    build: 
      context: ../user-service  # Adjust path to your user service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=1478
      - DB_NAME=userdb
    depends_on:
      - user-db
    networks:
      - app-network

  # Gap Casino Service
  gap-casino-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - USER_SERVICE_URL=http://user-service:3001
      - DB_HOST=casino-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=1478
      - DB_NAME=casinodb
      - STUDIO21_BASE_URL=https://gaiastg.s21games.com
      - STUDIO21_PARTNER_ID=fair91
      - GAP_CASINO_BASE_URL=https://dev-api.dreamdelhi.com/api/operator
      - GAP_OPERATOR_ID=HypexDemo
    depends_on:
      - casino-db
    networks:
      - app-network

  # User Service Database
  user-db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1478
      - POSTGRES_DB=userdb
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network

  # Gap Casino Service Database
  casino-db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1478
      - POSTGRES_DB=casinodb
    volumes:
      - casino-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - app-network

volumes:
  user-db-data:
  casino-db-data:

networks:
  app-network:
    driver: bridge