services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      args:
        APP_WORKSPACE: apps/user-server
    image: sportbooks-user-server:staging
    command: npm --workspace packages/db run deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  user-server:
    image: sportbooks-user-server:staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      USER_SERVER_PORT: 3020
      USER_JWT_SECRET: ${USER_JWT_SECRET}
      USER_JWT_EXPIRES_IN: 6h
      USER_CORS_ORIGINS: https://xfair91.com,https://www.xfair91.com
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_MAIL: ${SMTP_FROM_MAIL}
      EMAIL_DEV_OTP_RESPONSE: "false"
    ports:
      - "127.0.0.1:3020:3020"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3020/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  odds-server:
    build:
      context: .
      args:
        APP_WORKSPACE: apps/odds-server
    image: sportbooks-odds-server:staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 3010
      ODDS_API_KEY: ${ODDS_API_KEY}
      ODDS_API_BASE_URL: https://api.the-odds-api.com
      ODDS_CORS_ORIGINS: https://xfair91.com,https://www.xfair91.com
      FAKE_ODDS_ENABLED: ${FAKE_ODDS_ENABLED}
      FAKE_ODDS_INTERVAL_MS: 1500
      FAKE_ODDS_SPORTS: ${FAKE_ODDS_SPORTS}
      EVENT_SYNC_INTERVAL_MS: 1800000
    ports:
      - "127.0.0.1:3010:3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: