services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      args:
        APP_WORKSPACE: apps/user-server
    image: sportbooks-user-server:staging
    command: npm --workspace packages/db run deploy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  user-server:
    build:
      context: .
      args:
        APP_WORKSPACE: apps/user-server
    image: sportbooks-user-server:staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      USER_SERVER_PORT: ${USER_SERVER_PORT}
      USER_JWT_SECRET: ${USER_JWT_SECRET}
      USER_JWT_EXPIRES_IN: 6h
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      USER_CORS_ORIGINS: https://xfair91.com,https://www.xfair91.com
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_MAIL: ${SMTP_FROM_MAIL}
      EMAIL_DEV_OTP_RESPONSE: ${EMAIL_DEV_OTP_RESPONSE}
    ports:
      - "${USER_SERVER_PORT}:${USER_SERVER_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.USER_SERVER_PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  odds-server:
    build:
      context: .
      args:
        APP_WORKSPACE: apps/odds-server
    image: sportbooks-odds-server:staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: ${ODDS_SERVER_PORT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ODDS_API_KEY: ${ODDS_API_KEY}
      ODDS_API_BASE_URL: ${ODDS_API_BASE_URL}
      ODDS_CORS_ORIGINS: ${ODDS_CORS_ORIGINS}
      FAKE_ODDS_ENABLED: ${FAKE_ODDS_ENABLED}
      FAKE_ODDS_INTERVAL_MS: 1500
      FAKE_ODDS_SPORTS: ${FAKE_ODDS_SPORTS}
      EVENT_SYNC_INTERVAL_MS: 1800000
    ports:
      - "${ODDS_SERVER_PORT}:${ODDS_SERVER_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  admin-server:
    build:
      context: .
      args:
        APP_WORKSPACE: apps/admin-server
    image: sportbooks-admin-server:staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_SERVER_PORT: ${ADMIN_SERVER_PORT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - "${ADMIN_SERVER_PORT}:${ADMIN_SERVER_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.ADMIN_SERVER_PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  prisma-studio:
    build:
      context: .
      args:
        APP_WORKSPACE: apps/user-server
    image: sportbooks-user-server:staging
    restart: unless-stopped
    command: npx prisma studio --schema packages/db/prisma/schema.prisma --hostname 0.0.0.0 --port 5555 --browser none
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: sportsbook_v2_postgres_data
  redis_data:
    name: sportsbook_v2_redis_data